# Build this checkout (DocuSeal source plus the GXB overlay) and push to GHCR.
# Branding and the source archive are baked into the image. See deploy/README.md.
service: sign
image: gxbvc/sign

servers:
  web:
    hosts:
      - 104.131.24.46
    options:
      memory: 1g
      init: true
      workdir: /app

registry:
  server: ghcr.io
  username: christiangenco
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  host: sign.gxb.vc
  ssl: true
  app_port: 3000
  response_timeout: 120
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  clear:
    APP_URL: https://sign.gxb.vc
    FORCE_SSL: "true"
    RAILS_LOG_TO_STDOUT: "true"
    SMTP_FROM: "GXB Sign <sign@gxb.vc>"
    SMTP_ADDRESS: smtp.mailgun.org
    SMTP_PORT: "587"
    SMTP_DOMAIN: sign.gxb.vc
    SMTP_AUTHENTICATION: plain
    SMTP_ENABLE_STARTTLS: "true"
    SMTP_SSL_VERIFY: "true"
    SMTP_OPEN_TIMEOUT: "15"
    SMTP_READ_TIMEOUT: "25"
  secret:
    - SMTP_USERNAME
    - SMTP_PASSWORD

volumes:
  - sign_storage:/data/docuseal

# Local Docker is not running. Build on the app host's BuildKit, like ~/projects/chat.
builder:
  arch: amd64
  context: .
  remote: ssh://root@104.131.24.46

deploy_timeout: 180
retain_containers: 3
