# Pull the pinned upstream image and mount the branding layer. Never build this checkout.
service: sign
image: docuseal/docuseal

servers:
  web:
    hosts:
      - 104.131.24.46
    options:
      memory: 1g
      init: true
      workdir: /app

# Kamal requires these fields. bin/deploy-sign pulls the public image anonymously
# and uses app boot, which does not log in to a registry. These are not secrets.
registry:
  username: unused-public-image
  password: unused-public-image

proxy:
  host: sign.gxb.vc
  ssl: true
  app_port: 3000
  response_timeout: 120
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  clear:
    APP_URL: https://sign.gxb.vc
    FORCE_SSL: "true"
    RAILS_LOG_TO_STDOUT: "true"
    SMTP_FROM: "GXB Sign <sign@gxb.vc>"
    # Delivery stays disabled until the sending provider is verified.
    SMTP_ADDRESS: 127.0.0.1
    SMTP_PORT: "1"
    SMTP_OPEN_TIMEOUT: "2"

volumes:
  - sign_storage:/data/docuseal
  - /opt/sign/branding/<%= ENV.fetch('SIGN_DEPLOY_VERSION', 'candidate') %>:/opt/gxb-sign:ro
  - /opt/sign/branding/<%= ENV.fetch('SIGN_DEPLOY_VERSION', 'candidate') %>/public:/app/public/gxb-sign:ro
  - /opt/sign/branding/<%= ENV.fetch('SIGN_DEPLOY_VERSION', 'candidate') %>/initializer.rb:/app/config/initializers/gxb_sign.rb:ro
  - /opt/sign/branding/<%= ENV.fetch('SIGN_DEPLOY_VERSION', 'candidate') %>/public/favicon.ico:/app/public/favicon.ico:ro
  - /opt/sign/branding/<%= ENV.fetch('SIGN_DEPLOY_VERSION', 'candidate') %>/public/favicon.svg:/app/public/favicon.svg:ro

builder:
  arch: amd64

deploy_timeout: 180
retain_containers: 3
